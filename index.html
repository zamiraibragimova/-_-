<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Копилка — копи на мечту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-glow bg-glow--1"></div>
<div class="bg-glow bg-glow--2"></div>
<div class="bg-grid"></div>

<header class="header">
  <div class="logo">
    <div class="logo-badge">🐷</div>
    <div class="logo-text">
      <span class="logo-title" data-i18n="appName">Копилка</span>
      <span class="logo-sub" data-i18n="appTag">Мои деньги — мои цели</span>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-switch" role="tablist">
      <button class="lang-btn" data-lang="uz">UZ</button>
      <button class="lang-btn lang-btn--active" data-lang="ru">RU</button>
    </div>
    <button class="reset-btn" id="resetBtn" title="" data-i18n-title="resetTitle">↺</button>
  </div>
</header>

<main class="layout">

  <!-- Левая колонка: баланс и цель -->
  <aside class="col col--left">
    <div class="card balance-card">
      <span class="card-label" data-i18n="balanceLabel">Текущий баланс</span>
      <div class="balance-value">
        <span id="balanceValue">0</span>
        <span class="balance-currency" data-i18n="currency">сум</span>
      </div>
      <div class="balance-bar">
        <div class="balance-bar-fill" id="balanceBarFill"></div>
      </div>
      <div class="balance-percent" id="balancePercent">0%</div>
    </div>

    <div class="card goal-card">
      <div class="goal-head">
        <span class="card-label" data-i18n="goalLabel">Твоя цель</span>
        <button class="edit-goal" id="editGoalBtn" data-i18n="edit">✎</button>
      </div>
      <div class="goal-value">
        <span id="goalValue">10 000 000</span>
        <span class="balance-currency" data-i18n="currency">сум</span>
      </div>
      <div class="goal-remaining" id="goalRemaining"></div>
    </div>

    <div class="card stats-card">
      <div class="stat">
        <div class="stat-icon stat-icon--in">↗</div>
        <div>
          <div class="stat-label" data-i18n="income">Пополнено</div>
          <div class="stat-value stat-value--in" id="incomeValue">0</div>
        </div>
      </div>
      <div class="stat">
        <div class="stat-icon stat-icon--out">↘</div>
        <div>
          <div class="stat-label" data-i18n="expense">Снято</div>
          <div class="stat-value stat-value--out" id="expenseValue">0</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Центр: копилка -->
  <section class="col col--center">
    <h1 class="page-title" data-i18n="pageTitle">Твоя копилка</h1>
    <p class="page-sub" data-i18n="pageSub">Копи. Мечтай. Достигай.</p>

    <div class="jar-wrap" id="jarWrap">
      <div class="jar-lid"><div class="jar-lid-ring"></div></div>
      <div class="jar-neck"></div>
      <div class="jar-body" id="jarBody">
        <div class="jar-inner" id="jarInner">
          <div class="money-fill" id="moneyFill">
            <div class="money-stack" id="moneyStack"></div>
            <div class="money-surface" id="moneySurface"></div>
          </div>
          <div class="jar-shine"></div>
          <div class="jar-shine jar-shine--2"></div>
        </div>
        <div class="coin-layer" id="coinLayer"></div>
      </div>
      <div class="jar-shadow"></div>

      <div class="jar-scale">
        <div class="jar-scale-line">
          <span class="jar-scale-mark" style="bottom:100%">100%</span>
          <span class="jar-scale-mark" style="bottom:50%">50%</span>
          <span class="jar-scale-mark" style="bottom:0%">0%</span>
          <div class="jar-scale-fill" id="scaleFill"></div>
        </div>
      </div>
    </div>

    <div class="jar-balance-float">
      <span id="floatBalance">0</span> <span data-i18n="currency">сум</span>
    </div>
  </section>

  <!-- Правая колонка: действия + история -->
  <aside class="col col--right">
    <div class="card action-card">
      <div class="tabs">
        <button class="tab tab--active" id="tabAdd" data-i18n="tabAdd">Пополнить</button>
        <button class="tab" id="tabWithdraw" data-i18n="tabWithdraw">Снять</button>
      </div>
      <label class="field-label" data-i18n="amountLabel">Сумма (сум)</label>
      <div class="amount-field">
        <input type="text" inputmode="numeric" id="amountInput" data-i18n-ph="amountPh" placeholder="Введите сумму">
      </div>
      <div class="quick-amounts">
        <button class="chip" data-amount="100000">+100K</button>
        <button class="chip" data-amount="200000">+200K</button>
        <button class="chip" data-amount="500000">+500K</button>
        <button class="chip" data-amount="1000000">+1M</button>
      </div>
      <button class="action-btn" id="actionBtn">
        <span class="action-btn-icon">+</span>
        <span id="actionBtnText" data-i18n="addBtn">Добавить</span>
      </button>
    </div>

    <div class="card history-card">
      <div class="history-head">
        <span class="card-label" data-i18n="historyLabel">История операций</span>
        <span class="history-count" id="historyCount"></span>
      </div>
      <ul class="history-list" id="historyList"></ul>
      <div class="history-empty" id="historyEmpty" data-i18n="historyEmpty">Пока нет операций — сделай первый шаг 🌱</div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<footer class="footer">
  <span data-i18n="footerText">Маленькие шаги каждый день приводят к большим результатам</span>
</footer>

<script src="app.js"></script>
</body>
</html>
